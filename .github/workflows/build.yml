name: Build APK

# Skip the APK build when a push / PR only touches files that do not
# influence the compiled app:
#   * e2e/**                       — Go testserver, used only by the E2E
#                                    workflow on its own emulator job
#   * docs (root *.md, etc.)       — text-only, no Kotlin / C / gradle
#   * sibling workflow .yml files  — they manage their own triggers
#   * .gitignore                   — affects nothing AGP reads
#
# Anything that does change the APK (app/**, build.gradle.kts,
# settings.gradle.kts, gradle.properties, gradle/, gradlew*, keystore.jks,
# and this file itself) still triggers normally.
#
# `workflow_dispatch` stays so an APK can be rebuilt on demand even for
# a docs-only branch.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # All pins below are driven by app/build.gradle.kts and are
          # independent of `minSdk` — keep them in lock-step with the
          # build script, not the minimum Android version we ship for.
          #   * platforms;android-35 + build-tools;35.0.0 — compileSdk/targetSdk
          #   * ndk;26.3.11579264 — ndkVersion = "26.3.11579264" (NDK r26d)
          #   * cmake;3.22.1 — cmake { version = "3.22.1" }
          # The NDK + CMake are needed for libagentsplice.so (kernel splice(2)
          # zero-copy shim, NATIVE engine TCP fast path). Lowering minSdk
          # would NOT let you drop any of these — they're host-side toolchain
          # versions, not runtime API levels.
          #
          # `platform-tools` (adb, fastboot) is intentionally omitted — this
          # workflow doesn't run adb / emulators. Add it back if a future
          # job installs the APK on a connected device.
          packages: "platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Include CMakeLists.txt + C sources so a cpp change busts
          # the cache and CI rebuilds the .so rather than picking up
          # a stale one from the previous run.
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt', '**/*.c', '**/*.cpp', '**/*.h') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build both variants in a single Gradle invocation. With --no-daemon
      # each `./gradlew …` call boots a fresh JVM (~5-10s) and reparses the
      # whole build, so two separate steps cost double the bootstrap. AGP
      # already shares pre-build / merge-resources / native-build / lint
      # work between debug and release where it can, so doing both in one
      # task graph also lets Gradle reuse intermediates that would
      # otherwise be re-checked.
      - name: Build debug + release APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --build-cache --stacktrace

      # Sanity check: the built APK's manifest must declare the minSdk we
      # set in app/build.gradle.kts (currently 23 = Android 6.0). Catches
      # accidental downgrades or AGP variant-merge weirdness. Anchor the
      # grep to ^sdkVersion: so we don't accidentally read targetSdkVersion.
      - name: Verify APK minSdk
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          MIN_SDK=$("$AAPT" dump badging "$APK" | grep -E "^sdkVersion:'[0-9]+'" | grep -oE "[0-9]+")
          echo "APK minSdkVersion: $MIN_SDK (expected 23)"
          if [ "$MIN_SDK" != "23" ]; then
            echo "ERROR: built APK has minSdkVersion=$MIN_SDK, expected 23"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-agent-debug-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-agent-release-build-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
