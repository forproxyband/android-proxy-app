name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NDK + CMake are required by app/src/main/cpp/CMakeLists.txt
          # (libagentsplice.so — kernel splice(2) zero-copy shim used
          # by the NATIVE engine's TCP bridge). Pin the same NDK
          # version we set in app/build.gradle.kts so CI is deterministic.
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools ndk;26.3.11579264 cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Include CMakeLists.txt + C sources so a cpp change busts
          # the cache and CI rebuilds the .so rather than picking up
          # a stale one from the previous run.
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt', '**/*.c', '**/*.cpp', '**/*.h') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-agent-debug-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: proxy-agent-release-build-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
