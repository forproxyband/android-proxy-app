name: E2E

# Manual only — emulator boot + cross-ABI build is ~10–15 min, far too
# expensive for every PR. Trigger from the Actions UI or via gh CLI:
#   gh workflow run E2E.yml
#
# No inputs by design: api-level and payload size match the production
# server's configuration. Round-trip payload sizes are baked into the
# tests (single-tunnel = 64 KiB via E2EConfig.payloadBytes; throughput
# tests fix their own 4 MiB × 16-stream profile, matching the speedtest
# pattern). To override per-run during local debugging use:
#   ./gradlew connectedDebugAndroidTest -Pe2e=true -Pe2eBytes=<n>
on:
  workflow_dispatch:

jobs:
  e2e:
    name: Emulator e2e (Go mock + connected tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Go testserver: build, then start in background ───────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: e2e/testserver/go.sum

      - name: Build testserver
        working-directory: e2e/testserver
        run: |
          go build -o testserver-bin .
          ls -la testserver-bin

      # Stays running for the whole job. We capture the PID in $GITHUB_ENV
      # so the cleanup step can kill it even if the test step short-circuits.
      - name: Start testserver
        run: |
          nohup ./e2e/testserver/testserver-bin \
              --bind 0.0.0.0 \
              --tcp-port 17080 --quic-port 17080 \
              --echo-port 17082 --api-port 17083 \
              --auth-key e2e \
              > testserver.log 2>&1 &
          echo "TESTSERVER_PID=$!" >> "$GITHUB_ENV"
          echo "started pid=$!"

      # Block until both TCP + QUIC listeners are live. healthz returns 200
      # once Hub.tcpReady && Hub.quicReady — see e2e/testserver/api.go.
      - name: Wait for testserver healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17083/healthz > /dev/null 2>&1; then
              echo "testserver up after $i tries"
              exit 0
            fi
            sleep 1
          done
          echo "testserver did not come up — log follows:"
          cat testserver.log
          exit 1

      # ── Android toolchain (parallels build.yml) ──────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Mirrors build.yml — these versions are driven by
          # app/build.gradle.kts (compileSdk=35, ndkVersion=26.3.11579264,
          # cmake.version=3.22.1). Adds `platform-tools` because the
          # emulator runner needs `adb`.
          packages: "platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1 platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # androidTest deps differ from app deps; include the same fan
          # of files as build.yml plus the new test source set so a test
          # change still busts the cache.
          key: gradle-e2e-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt', '**/*.c', '**/*.cpp', '**/*.h', 'app/src/androidTest/**') }}
          restore-keys: gradle-e2e-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # KVM acceleration knocks emulator boot from ~5 min QEMU-only to
      # ~30 s. ubuntu-latest images ship a KVM-capable kernel but the
      # /dev/kvm device defaults to root-only — the udev rule below opens
      # it up for the runner user. Standard pattern, see
      # https://github.com/ReactiveCircus/android-emulator-runner#usage.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Single emulator boot + connectedAndroidTest in one action. The
      # action's `script:` runs after the emulator is fully booted, so we
      # don't need to poll adb ourselves. -Pe2e=true flips the ABI filter
      # to include x86_64 (see app/build.gradle.kts:isE2eBuild).
      - name: Run connectedAndroidTest on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30 (Android 11): wide x86_64 system-image availability,
          # works with NDK r26d toolchain, well-tested by the emulator-
          # runner action. Pinned — production fleet is API 23+ but we
          # only need one level high enough to exercise the agent code.
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Test runner arguments (payload size, host, port, auth key)
          # are wired into app/build.gradle.kts via
          # testInstrumentationRunnerArguments — config-caching compatible.
          # Defaults match E2EConfig.kt and the testserver flags.
          #
          # We run gradle, then dump logcat regardless of gradle's outcome
          # so we can see what the agent's supervisor logged even when an
          # assertion swallowed the underlying error (e.g. QUIC dial
          # failure hidden by a TCP fallback). Both the full buffer and
          # a filtered slice (just the ProxyAgentE2E tag — that's where
          # E2EConfig.newLogSink writes the agent's log records) are
          # captured so we can grep without skimming a 100k-line dump.
          #
          # IMPORTANT: keep the script on one line. android-emulator-runner
          # hands the value to `sh -c` without interpreting YAML literal
          # blocks specially, so backslash-newline continuations are
          # passed through as a literal `\` argument and gradle reads it
          # as a task name ("Task '\' not found"). Use `;` to chain.
          script: ./gradlew :app:connectedDebugAndroidTest -Pe2e=true --no-daemon --stacktrace; GRADLE_EXIT=$?; adb logcat -d > "$GITHUB_WORKSPACE/logcat-full.txt" 2>&1 || true; adb logcat -d -s ProxyAgentE2E:V > "$GITHUB_WORKSPACE/logcat-agent.txt" 2>&1 || true; exit $GRADLE_EXIT

      # ── Cleanup + artifacts ──────────────────────────────────────────
      - name: Stop testserver
        if: always()
        run: |
          if [ -n "${TESTSERVER_PID:-}" ]; then
            kill "${TESTSERVER_PID}" 2>/dev/null || true
          fi

      - name: Upload testserver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testserver-log-${{ github.run_number }}
          path: testserver.log
          if-no-files-found: warn

      - name: Upload androidTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn

      - name: Upload logcat (emulator)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-${{ github.run_number }}
          path: |
            logcat-full.txt
            logcat-agent.txt
          if-no-files-found: warn
